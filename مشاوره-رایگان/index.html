<section class="hero">
  <div class="narrow">
    <p class="crumbs"><a href="../">خانه</a> / مشاوره رایگان</p>
    <h1>مشاوره رایگان با پزشک متخصص</h1>
    <p class="lead">فرم مشاوره رایگان مه نگاه در سعادت‌آباد. نام و موبایل را بفرستید تا برای هایفوتراپی، لیزر، فیشیال یا زاویه فک تماس بگیریم.</p>
    
<section class="section" id="moshavere">
  <div class="card">
    <h2>فرم مشاوره</h2>
    <p class="muted">نام، موبایل و خدمت مورد نظر را بفرستید تا مشاور مه نگاه با شما تماس بگیرد.</p>
    <form class="form" data-lead-form>
      <label>نام کامل
        <input name="name" type="text" required autocomplete="name" placeholder="نام و نام خانوادگی">
      </label>
      <label>موبایل
        <input name="phone" type="tel" required inputmode="numeric" lang="en" autocomplete="tel" maxlength="11" minlength="11" pattern="09[0-9]{9}" placeholder="0912xxxxxxx" dir="ltr">
      </label>
      <label>خدمت مورد نظر
        <select name="service" required>
          <option value="" disabled selected>انتخاب کنید</option>
          <option value="هایفوتراپی">هایفوتراپی</option>
          <option value="مزوتراپی">مزوتراپی</option>
          <option value="زاویه سازی فک">زاویه سازی فک</option>
          <option value="ژل و فیلر">ژل و فیلر</option>
          <option value="بوتاکس">بوتاکس</option>
          <option value="لیزر">لیزر</option>
          <option value="فیشیال">فیشیال</option>
          <option value="لاغری">لاغری</option>
          <option value="لابیا پلاستی">لابیا پلاستی</option>
          <option value="سایر خدمات">سایر خدمات</option>
        </select>
      </label>
      <div class="hp-field" aria-hidden="true">
        <label>شرکت<input name="company" type="text" tabindex="-1" autocomplete="off"></label>
      </div>
      <button class="btn btn-primary" type="submit">ارسال درخواست</button>
      <div class="form-status" data-form-status></div>
    </form>
  </div>
</section>
